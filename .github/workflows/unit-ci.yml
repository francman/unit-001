name: Unit CI

# Builds the packages unit-001 depends on and runs the build, typecheck, and test scripts of every unit-001 workspace
# (apps/unit-*, packages/unit-*) on Linux, macOS, and Windows, because the agent must start on every supported OS.
# Workspaces are discovered, so adding one needs no edit here.
# Upstream's CI workflow (ci.yml) keeps checking the whole tree with biome and tsc.

on:
  push:
    branches: [main]
    paths: ["apps/unit-*/**", "packages/unit-*/**", ".github/workflows/unit-ci.yml", ".github/scripts/unit-workspaces.*"]
  pull_request:
    branches: [main]
    paths: ["apps/unit-*/**", "packages/unit-*/**", ".github/workflows/unit-ci.yml", ".github/scripts/unit-workspaces.*"]

concurrency:
  group: unit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # The newest Node as well, on one OS.
          - os: ubuntu-latest
            node: 24
    defaults:
      run:
        # Git Bash on Windows, so one script serves every OS.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Test workspace discovery
        run: node --test .github/scripts/unit-workspaces.test.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Only what unit-001 imports, in dependency order; upstream's own CI builds and tests the rest.
      - name: Build upstream packages
        run: |
          for package in telemetry chord codemode ai durable; do
            npm run build --workspace "packages/$package"
          done

      - name: Build, typecheck, and test unit workspaces
        run: |
          found=0
          for script in build typecheck test; do
            for workspace in $(node .github/scripts/unit-workspaces.mjs "$script"); do
              found=1
              echo "::group::$script $workspace"
              npm run "$script" --workspace "$workspace"
              echo "::endgroup::"
            done
          done
          if [ "$found" = 0 ]; then
            echo "::warning::No unit workspace defines build, typecheck, or test; nothing was checked."
          fi
